{% extends 'base.html' %}
{% block title %}EduPredict AI | Student Profile{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-8">
        <div class="card form-card" data-searchable>
            <div class="card-body p-4">
                <p class="eyebrow">Account / Student information</p>
                <h1 class="page-title">Student Profile</h1>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" name="name" value="{{ user.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Student ID</label>
                        <input type="text" class="form-control" name="student_id" value="{{ profile.student_id if profile else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Department</label>
                        <select class="form-select" name="department" required>
                            <option value="">Select department</option>
                            {% for dept in ['CSE', 'ECE', 'Mechanical', 'Civil', 'IT'] %}
                            <option value="{{ dept }}" {% if profile and profile.department == dept %}selected{% endif %}>{{ dept }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Semester</label>
                        <input type="number" class="form-control" name="semester" min="2" max="8" value="{{ profile.semester if profile else 5 }}" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Save Profile</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
